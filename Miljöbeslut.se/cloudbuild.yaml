# cloudbuild.yaml — build → push → Prisma/PostGIS (Cloud Run Job) → deploy Cloud Run
# med runtime service account, env och Secret Manager-anslutningar.
#
# gcloud builds submit --config=cloudbuild.yaml --substitutions=SHORT_SHA=$(git rev-parse --short HEAD)
#
# Sätt minst: _CLOUDSQL, _VPC_CONNECTOR, _GCS_DOCUMENTS_BUCKET (rekommenderat).
# Förbered: Secret Manager (DATABASE_URL, JWT_*, SEARCH_ENCRYPTION_KEY_BASE64, …), migrate-jobb, VPC.
# Se docs/deploy/DEPLOY_GCP.md och docs/deploy/GCP_P2_PLATFORM.md

substitutions:
  _REGION: europe-west1
  _SERVICE: miljobeslut
  _REPO: miljobeslut
  _CLOUDSQL: ''
  _DB_MIGRATE_JOB: miljobeslut-migrate
  _VPC_CONNECTOR: miljobeslut-vpc
  _RUNTIME_SA: miljobeslut-runtime
  _GCS_DOCUMENTS_BUCKET: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitution_option: ALLOW_LOOSE

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-f'
      - Dockerfile.gcp
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
      - '.'

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}'

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud run jobs update ${_DB_MIGRATE_JOB} \
          --region=${_REGION} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA} \
          --service-account=${_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com \
          --command=/bin/sh \
          --args='-c','npx prisma migrate deploy && npx tsx scripts/db/spatial-bootstrap.ts' \
          --set-cloudsql-instances=${_CLOUDSQL} \
          --vpc-connector=${_VPC_CONNECTOR} \
          --vpc-egress=private-ranges-only \
          --set-secrets=DATABASE_URL=DATABASE_URL:latest \
          --quiet
        gcloud run jobs execute ${_DB_MIGRATE_JOB} --region=${_REGION} --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE='${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}'
        # Minimikrets — lägg fler hemligheter samma mönster: SM_NAMN=SM_NAMN:latest
        SECRETS='DATABASE_URL=DATABASE_URL:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,SEARCH_ENCRYPTION_KEY_BASE64=SEARCH_ENCRYPTION_KEY_BASE64:latest,INTERNAL_CRON_TOKEN=INTERNAL_CRON_TOKEN:latest'
        ENV='NODE_ENV=production,VERTEX_PROJECT_ID=${PROJECT_ID},VERTEX_LOCATION=${_REGION},PROPERTY_LOOKUP_MODE=hybrid,DOMSTOL_RSS_ENABLED=true,GDPR_CRON_IN_PROCESS=false,SEARCH_WORKER_ENABLED=false'
        if [ -n "${_GCS_DOCUMENTS_BUCKET}" ]; then
          ENV="$${ENV},GCS_DOCUMENTS_BUCKET=${_GCS_DOCUMENTS_BUCKET},GCS_DOCUMENTS_PREFIX=documents"
        fi
        gcloud run deploy ${_SERVICE} \
          --region=${_REGION} \
          --image="$${IMAGE}" \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --cpu=1 \
          --memory=1Gi \
          --min-instances=1 \
          --max-instances=10 \
          --timeout=3600 \
          --session-affinity \
          --service-account=${_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com \
          --vpc-connector=${_VPC_CONNECTOR} \
          --vpc-egress=private-ranges-only \
          --set-cloudsql-instances=${_CLOUDSQL} \
          --set-env-vars="$${ENV}" \
          --set-secrets="$${SECRETS}" \
          --quiet
        echo "Klart. Lägg INTERNAL_CRON_TOKEN i Secret Manager, mappa till Cloud Run, och triggare mot /api/internal/background/* (se GCP_P2_PLATFORM.md)."
